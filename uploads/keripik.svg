<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="chip1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="chip2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="420" fill="url(#bg)"/>
  <circle cx="500" cy="90" r="105" fill="#fcd34d" opacity="0.3"/>
  <circle cx="95" cy="330" r="120" fill="#fde68a" opacity="0.5"/>
  <ellipse cx="300" cy="335" rx="170" ry="26" fill="#78350f" opacity="0.14"/>
  <!-- Bowl / Chips Cluster -->
  <g filter="url(#shadow)">
    <ellipse cx="235" cy="195" rx="72" ry="52" transform="rotate(-18 235 195)" fill="url(#chip1)" stroke="#d97706" stroke-width="3"/>
    <ellipse cx="355" cy="185" rx="76" ry="54" transform="rotate(15 355 185)" fill="url(#chip2)" stroke="#d97706" stroke-width="3"/>
    <ellipse cx="295" cy="155" rx="70" ry="50" transform="rotate(-5 295 155)" fill="url(#chip1)" stroke="#b45309" stroke-width="3"/>
    <ellipse cx="260" cy="230" rx="78" ry="54" transform="rotate(8 260 230)" fill="url(#chip2)" stroke="#d97706" stroke-width="3"/>
    <ellipse cx="345" cy="228" rx="74" ry="50" transform="rotate(-14 345 228)" fill="url(#chip1)" stroke="#b45309" stroke-width="3"/>
    <!-- Texture dots on chips -->
    <circle cx="255" cy="220" r="3" fill="#b45309" opacity="0.45"/>
    <circle cx="280" cy="235" r="2.5" fill="#b45309" opacity="0.45"/>
    <circle cx="335" cy="215" r="3" fill="#b45309" opacity="0.45"/>
    <circle cx="360" cy="232" r="2.5" fill="#b45309" opacity="0.45"/>
    <circle cx="295" cy="148" r="3" fill="#b45309" opacity="0.45"/>
    <!-- Wooden / Ceramic Bowl -->
    <path d="M145 225 L455 225 C445 305, 385 335, 300 335 C215 335, 155 305, 145 225 Z" fill="#92400e"/>
    <path d="M140 225 L460 225" stroke="#b45309" stroke-width="10" stroke-linecap="round"/>
    <path d="M185 265 C225 282, 375 282, 415 265" stroke="#fcd34d" stroke-width="3" stroke-dasharray="10 8" fill="none" opacity="0.6"/>
  </g>
  <rect x="24" y="356" width="185" height="38" rx="19" fill="#ffffff" opacity="0.9"/>
  <text x="116" y="380" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">🥨 Renyah Tanpa Pengawet</text>
</svg>