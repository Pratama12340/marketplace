    <path d="M205 228 C235 258, 282 280, 335 278" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
  <rect x="24" y="356" width="170" height="38" rx="19" fill="#ffffff" opacity="0.88"/>
  <text x="109" y="380" font-family="sans-serif" font-size="14" font-weight="700" fill="#be123c" text-anchor="middle">🌶️ Panen Segar Petani</text>
