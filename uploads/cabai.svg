    <path d="M225 142 C220 112, 198 96, 180 92" stroke="#15803d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Chili 2 (Center Front) -->
    <path d="M250 120 C250 205, 305 290, 420 285 C452 283, 478 265, 488 248 C455 262, 405 260, 355 225 C308 192, 290 150, 285 115 Z" fill="url(#chili2)"/>
    <path d="M267 122 C265 92, 248 72, 226 65" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none"/>
