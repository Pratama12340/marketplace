<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <pattern id="kawung" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#451a03"/>
      <circle cx="24" cy="24" r="20" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <ellipse cx="24" cy="10" rx="7" ry="11" fill="#d97706" stroke="#fef3c7" stroke-width="1.2"/>
      <ellipse cx="24" cy="38" rx="7" ry="11" fill="#d97706" stroke="#fef3c7" stroke-width="1.2"/>
      <ellipse cx="10" cy="24" rx="11" ry="7" fill="#d97706" stroke="#fef3c7" stroke-width="1.2"/>
      <ellipse cx="38" cy="24" rx="11" ry="7" fill="#d97706" stroke="#fef3c7" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="4" fill="#fef3c7"/>
      <circle cx="0" cy="0" r="3" fill="#fcd34d"/>
      <circle cx="48" cy="0" r="3" fill="#fcd34d"/>
      <circle cx="0" cy="48" r="3" fill="#fcd34d"/>
      <circle cx="48" cy="48" r="3" fill="#fcd34d"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#451a03" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="600" height="420" fill="url(#bg)"/>
  <circle cx="490" cy="80" r="105" fill="#f59e0b" opacity="0.16"/>
  <circle cx="110" cy="335" r="125" fill="#d97706" opacity="0.14"/>
  <!-- Draped Batik Cloth -->
  <g filter="url(#shadow)">
    <rect x="130" y="75" width="340" height="250" rx="18" transform="rotate(-4 300 200)" fill="#78350f" stroke="#fcd34d" stroke-width="4"/>
    <rect x="145" y="90" width="310" height="250" rx="18" transform="rotate(3 300 215)" fill="url(#kawung)" stroke="#fbbf24" stroke-width="4"/>
    <!-- Gold border trim -->
    <rect x="157" y="102" width="286" height="226" rx="12" transform="rotate(3 300 215)" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
  <rect x="24" y="356" width="185" height="38" rx="19" fill="#ffffff" opacity="0.92"/>
  <text x="116" y="380" font-family="sans-serif" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">✨ Batik Tulis Nusantara</text>
</svg>